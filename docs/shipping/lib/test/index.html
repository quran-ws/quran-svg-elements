<!doctype html>
<meta charset="utf-8">
<title>mushaf.js tests</title>
<style>
  body{font:14px/1.5 system-ui;margin:16px}
  #stage{position:relative;display:inline-block;width:520px}
  #stage svg{display:block;width:100%;height:auto}
  #log{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}
  .pass{color:#080}.fail{color:#c00;font-weight:700}
</style>
<h3>mushaf.js test run</h3>
<div id="stage"></div>
<div id="log"></div>

<script type="module">
let M, load;
/* Serve any directory that holds the page SVGs and (for the atlas tests) an
   atlas.json built by ../build-atlas.py, then point these at it:
     ?pages=/quran/pages/&atlas=/quran/atlas.json                            */
const q = new URLSearchParams(location.search);
const PAGES = q.get('pages') || '../../../../.cache/words-svg/hafs-kfqc/';
const ATLAS = q.get('atlas') || 'atlas.json';

const R = { pass: 0, fail: 0, tests: [], errors: [] };
window.__RESULTS__ = R;
const log = document.getElementById('log');

function ok(name, cond, detail) {
  const rec = { name, ok: !!cond, detail: detail === undefined ? null : detail };
  R.tests.push(rec);
  cond ? R.pass++ : R.fail++;
  const d = document.createElement('div');
  d.className = cond ? 'pass' : 'fail';
  d.textContent = (cond ? 'PASS  ' : 'FAIL  ') + name + (detail !== undefined ? '   ' + JSON.stringify(detail) : '');
  log.appendChild(d);
}
const eq = (name, a, b) => ok(name, JSON.stringify(a) === JSON.stringify(b), { got: a, want: b });
const near = (name, a, b, tol) => ok(name, Math.abs(a - b) <= tol, { got: a, want: b, tol });

window.addEventListener('error', e => R.errors.push('error: ' + e.message));
window.addEventListener('unhandledrejection', e => R.errors.push('rejection: ' + e.reason));

const stage = document.getElementById('stage');
function show(page) { stage.replaceChildren(page.el); return page; }

async function run() {
try {
  const bust = (location.search.match(/v=(\d+)/) || [0, Date.now()])[1];
  M = await import('../mushaf.mjs?v=' + bust);
  load = M.createLoader({ baseUrl: PAGES });
  /* ============================================ 1. loading and identity */
  const p42 = await load(42);
  ok('1.1 load returns a MushafPage', p42 instanceof M.MushafPage);
  eq('1.2 page 42 word count', p42.wordCount, 147);
  eq('1.3 profile is dev (ligature layer present)', p42.profile, 'dev');
  eq('1.4 viewBox read off the file', p42.viewBox, { x: 0, y: 0, w: 345, h: 550 });
  eq('1.5 polygons dropped by the loader', p42.el.querySelectorAll('path.ayahPolygon').length, 0);

  const p1 = await load(1);
  eq('1.6 page 1 uses the same viewBox as every page (normalised since 2026-09-04)',
     p1.viewBox, { x: 0, y: 0, w: 345, h: 550 });
  eq('1.7 page 1 has 8 printed lines', p1.lines().length, 8);
  eq('1.8 page 1 word count', p1.wordCount, 29);
  eq('1.9 page 1: one marker group per ayah, every one with data-ayah-key',
     [p1.ayahMarkGroups().length, p1.ayahMarks().length], [7, 7]);
  eq('1.9b page 1: each marker holds the ring, one tagged copy of it, and the numeral',
     p1.ayahMarks().map(m => [!!m.ring, m.ringCopies.length, !!m.numeral]).every(x => x[0] && x[1] === 1 && x[2]), true);
  eq('1.9c page 42: no ring copies outside the opening spread',
     p42.ayahMarks().every(m => m.ringCopies.length === 0), true);

  const p604 = await load(604), p176 = await load(176), p582 = await load(582);
  eq('1.10 page 604 words', p604.wordCount, 58);
  eq('1.11 all pages report 15 or 8 lines',
     [p42, p176, p582, p604].map(p => p.lines().length), [15, 15, 15, 15]);

  /* the loader hands out clones: mutating one must not touch the next */
  const a = await load(42), b = await load(42);
  a.words()[0].el.remove();
  eq('1.12 loader hands out independent clones', [a.wordCount, b.wordCount], [146, 147]);

  /* clone() namespaces ids so two copies can share a document */
  const c1 = p42.clone(), c2 = p42.clone();
  ok('1.13 clone() namespaces marker ids',
     c1.ayahMarks()[0].id !== c2.ayahMarks()[0].id && c1.ayahMarks()[0].id !== p42.ayahMarks()[0].id);
  ok('1.14 clone() keeps data-mark in step',
     c1.ayahs().every(x => !x.markId || c1.el.querySelector('#' + CSS.escape(x.markId))));

  /* production profile: same file with the ligature layer unwrapped */
  const prod = p42.clone();
  prod.el.querySelectorAll('g.ligature').forEach(g => { g.replaceWith(...g.childNodes); });
  eq('1.15 profile detection flips to production', prod.profile, 'production');
  eq('1.16 production keeps every word and mark',
     [prod.wordCount, prod.marks().length], [p42.wordCount, p42.marks().length]);
  eq('1.17 core still works on the production profile',
     [prod.ayah('2:255').words().length, prod.search('الله', { mode: 'exact' }).length],
     [p42.ayah('2:255').words().length, 5]);

  /* production profile, as SHIPPED since 2026-09-04: data-rasm-uthmani only on the
     word group; rasm / rasm_imlai / search / qpc come from index/by-page/NNN.json */
  const sidecar = { words: p42.words().map(w => ({ wordKey: w.wordKey, ...w.text })) };
  prod.el.querySelectorAll('g.word').forEach(g => {
    for (const k of ['rasm', 'rasm_imlai', 'search', 'qpc']) delete g.dataset[k];
  });
  eq('1.18 a shipped production word has rasm_uthmani inline and the rest null',
     [prod.word('2:255:1').form('rasm_uthmani') !== null, prod.word('2:255:1').form('search'),
      prod.word('2:255:1').text.rasm],
     [true, null, null]);
  eq('1.19 hasForm() says search is missing', [prod.hasForm('rasm_uthmani'), prod.hasForm('search')],
     [true, false]);
  let threw = null;
  try { prod.search('الله'); } catch (e) { threw = e.message; }
  ok('1.20 search() on a bare production page throws a message naming the sidecar',
     threw && /attachWords|index\/by-page/.test(threw), threw);
  eq('1.21 attachWords() returns the record count', prod.attachWords(sidecar), p42.wordCount);
  eq('1.22 after attachWords the five forms match the dev page',
     prod.word('2:255:1').text, p42.word('2:255:1').text);
  eq('1.23 search works from the sidecar',
     prod.search('الله', { mode: 'exact' }).map(m => m.wordKey),
     p42.search('الله', { mode: 'exact' }).map(m => m.wordKey));
  eq('1.24 page.text() reads the sidecar form',
     prod.text('2:255', { form: 'search' }), p42.text('2:255', { form: 'search' }));
  eq('1.25 clone() carries the sidecar',
     prod.clone().word('2:255:1').form('search'), p42.word('2:255:1').form('search'));
  eq('1.26 inline attributes win over the sidecar',
     p42.clone().attachWords({ words: [{ wordKey: '2:255:1', search: 'WRONG' }] }) && p42.word('2:255:1').form('search'),
     sidecar.words.find(r => r.wordKey === '2:255:1').search);
  {
    const seen = [];
    const stub = async u => {
      seen.push(u);
      if (u.endsWith('.json')) return { ok: true, json: async () => sidecar };
      return { ok: true, text: async () => new XMLSerializer().serializeToString(prod.el) };
    };
    const ld = M.createLoader({ baseUrl: 'x/pages/', fetch: stub, words: true });
    const pg = await ld(42);
    eq('1.27 createLoader({words:true}) fetches ../index/by-page/NNN.json and attaches it',
       [seen[1], pg.word('2:255:1').form('search')],
       ['x/pages/../index/by-page/042.json', p42.word('2:255:1').form('search')]);
  }

  /* ============================================ 2. metadata, no database */
  const s582 = p582.surahs();
  const naba = s582.find(s => s.number === 78);
  const banner78 = p582.el.querySelector('g.surah-name[data-sid="78"]');
  eq('2.1 surah record off the banner',
     [naba.arabic, naba.latin, naba.english, naba.revelationPlace, naba.ayahCount, naba.hasBanner, naba.hasBasmalah],
     [banner78.dataset.surahNameAr, banner78.dataset.surahNameLatin, banner78.dataset.surahNameEn,
      banner78.dataset.revelationPlace, 40, true, true]);
  eq('2.1b and it is surah Naba, 40 ayahs, makkah',
     [naba.latin, naba.ayahCount, naba.revelationPlace], ['Naba', 40, 'makkah']);
  ok('2.2 a surah present without a banner is still reported',
     p42.surahs().length === 1 && p42.surahs()[0].number === 2 && p42.surahs()[0].hasBanner === false);
  eq('2.3 page 604 carries three surah banners',
     p604.surahs().filter(s => s.hasBanner).map(s => s.number), [112, 113, 114]);
  ok('2.4 surah 1 has a banner but no basmalah group (its basmalah IS 1:1)',
     p1.surahs()[0].hasBanner === true && p1.surahs()[0].hasBasmalah === false);

  eq('2.5 juz 30 starts at 78:1 on page 582',
     p582.divisions().juz.map(d => [d.n, d.ayahKey]), [[30, '78:1']]);
  eq('2.6 page 42 opens rubu_al_hizb 17 / hizb 5 / juz 3 at 2:253',
     [p42.divisions().rubu_al_hizb.map(d => [d.n, d.ayahKey]),
      p42.divisions().hizb.map(d => [d.n, d.ayahKey]),
      p42.divisions().juz.map(d => [d.n, d.ayahKey])],
     [[[17, '2:253']], [[5, '2:253']], [[3, '2:253']]]);
  eq('2.7 page 42 draws one hizb rosette, agreeing with the ayah tags',
     p42.divisionMarks().map(r => [r.rubu_al_hizb, r.hizb, r.juz, r.ayahKey]), [[17, 5, 3, '2:253']]);
  eq('2.8 page 176 has the 7:206 sajdah', p176.sajdahs().map(s => s.ayahKey), ['7:206']);
  eq('2.9 no sajdah where there is none', p42.sajdahs().length, 0);

  eq('2.10 ayah keys on page 42', p42.ayahKeys(), ['2:253', '2:254', '2:255', '2:256']);
  const a255 = p42.ayah('2:255');
  ok('2.11 an ayah is several fragments, and knows it',
     a255.fragments.length > 1 && a255.fragmentCount === a255.fragments.length && a255.isComplete);
  ok('2.12 2:255 spans several printed lines', a255.lines.length > 1, a255.lines);
  ok('2.13 an ayah resolves to its medallion',
     a255.mark && a255.mark.dataset.ayahKey === '2:255');
  eq('2.14 summary() is one call', typeof p42.summary().divisions, 'object');

  /* words */
  const w = p42.word('2:255:1');
  eq('2.15 word text, all five forms', Object.keys(w.text).sort(),
     ['qpc', 'rasm', 'rasm_imlai', 'rasm_uthmani', 'search']);
  eq('2.16 word identity', [w.surah, w.ayah, w.number, w.ayahKey, w.line],
     [2, 255, 1, '2:255', Number(w.el.closest('g.line').dataset.line)]);
  eq('2.16b 2:255 opens on line 8', w.line, 8);
  const box = w.box();
  ok('2.17 word box is inside the page',
     box.x0 > 0 && box.x1 < 345 && box.y0 > 0 && box.y1 < 550, box);
  /* box() must be in VIEWBOX units, never CSS pixels. getCTM() returns the
     latter, which silently produces bands drawn in the wrong place. */
  {
    show(p42);
    const vb = p42.viewBox, sr = p42.el.getBoundingClientRect();
    const scale = sr.width / vb.w;
    const wr = p42.word('2:255:1').el.getBoundingClientRect();
    const b2 = p42.word('2:255:1').box();
    ok('2.18 box() is in viewBox units, not CSS pixels',
       Math.abs(b2.w * scale - wr.width) < 0.5 &&
       Math.abs(b2.x0 * scale - (wr.left - sr.left)) < 0.5,
       { scale, box: [b2.x0, b2.w], client: [wr.left - sr.left, wr.width] });
  }

  /* ============================================ 3. text extraction */
  const t255 = p42.text('2:255', { form: 'rasm_uthmani' });
  ok('3.1 ayah text starts with its own first word',
     t255.startsWith(p42.word('2:255:1').text.rasm_uthmani), t255.slice(0, 20));
  eq('3.2 ayah text word count', t255.split(/[\s\n]+/).length, a255.words().length);
  ok('3.3 a multi-line ayah carries the mushaf line breaks', t255.includes('\n'));
  eq('3.4 line text', p42.line(4).words().length, p42.words({ line: 4 }).length);
  eq('3.5 page text has every word',
     p42.text('page').split(/[\s\n]+/).length, p42.wordCount);
  eq('3.6 every always-present form is extractable',
     M.TEXT_FORMS.filter(f => f !== 'qpc').map(f => p42.text('2:255:1', { form: f }).length > 0),
     [true, true, true, true]);
  /* qpc rides on .cache/words-qpc/, which a checkout need not have; the emitter
     writes data-qpc only where it has one. Assert it only when the page has it. */
  ok('3.6b qpc is extractable when the page carries it',
     !p42.hasForm('qpc') || p42.text('2:255:1', { form: 'qpc' }).length > 0,
     p42.hasForm('qpc'));

  /* ============================================ 4. search */
  eq('4.1 exact search on page 42: الله',
     p42.search('الله', { mode: 'exact' }).map(m => m.wordKey),
     ['2:253:10', '2:253:24', '2:253:45', '2:253:49', '2:255:1']);
  const mn = p42.search('من', { mode: 'exact' }).map(m => m.wordKey);
  eq('4.2 exact search: من', mn,
     ['2:253:8', '2:253:28', '2:253:30', '2:253:38', '2:253:41', '2:254:7', '2:255:20', '2:255:36', '2:256:8']);
  eq('4.3 page 604 exact: الناس',
     p604.search('الناس', { mode: 'exact' }).map(m => m.wordKey),
     ['114:1:4', '114:2:2', '114:3:2', '114:5:5']);
  eq('4.4 page 604 exact: شر',
     p604.search('شر', { mode: 'exact' }).map(m => m.wordKey),
     ['113:2:2', '113:3:2', '113:4:2', '113:5:2', '114:4:2']);
  /* the whole point of the loose second pass */
  eq('4.5 typed الرحمان finds the printed الرحمن (dagger alef)',
     p1.search('الرحمان', { mode: 'exact' }).map(m => m.wordKey), ['1:1:3', '1:3:1']);
  eq('4.6 and الرحمن finds it too',
     p1.search('الرحمن', { mode: 'exact' }).map(m => m.wordKey), ['1:1:3', '1:3:1']);
  /* a query typed WITH diacritics still matches the bare data-search */
  eq('4.7 a fully-vocalised query is normalised',
     p42.search('ٱللَّهُ', { mode: 'exact' }).map(m => m.wordKey).length, 5);
  eq('4.8 prefix mode', p604.search('الن', { mode: 'prefix' }).map(m => m.wordKey),
     ['113:4:3', '114:1:4', '114:2:2', '114:3:2', '114:5:5']);
  ok('4.9 substring mode is a superset of exact',
     p42.search('من').length >= mn.length);
  eq('4.10 an empty query returns nothing', p42.search('   ').length, 0);
  eq('4.11 search returns word objects you can act on',
     p42.search('الله', { mode: 'exact' })[0].word instanceof M.Word, true);
  /* the strict pass must not be widened when it already worked */
  eq('4.12 loose pass does not fire when the strict pass matched',
     p42.search('ما', { mode: 'exact' }).map(m => m.wordKey),
     ['2:253:25', '2:253:32', '2:253:46', '2:253:51', '2:255:14', '2:255:28']);
  eq('4.13 normalisation helpers are exported',
     [M.normalizeQuery('ٱلَّذِينَ'), M.foldArabic('ة'), M.stripArabicMarks('سَنَةࣰ')],
     ['الذين', 'ه', 'سنة']);

  /* ============================================ 5. highlighting */
  show(p42);
  const band = p42.band('2:255');
  eq('5.1 one band per printed line the ayah occupies', band.bands, a255.lines.length);
  eq('5.2 the band group carries ONE opacity', band.el.getAttribute('opacity'), '0.3');
  ok('5.3 the band is painted first (behind the ink)', p42.el.firstElementChild === band.el);

  /* ---- ONE POLYGON, NOT A STACK OF LINES ---- */
  eq('5.3a a multi-line band is ONE <path>, not one rect per line',
     [band.el.children.length, band.el.children[0].tagName.toLowerCase(),
      band.el.querySelectorAll('rect').length],
     [1, 'path', 0]);
  ok('5.3b the ayah really does span several lines', band.bands > 1, band.bands);
  eq('5.3c one subpath per printed line',
     (band.d.match(/M/g) || []).length, band.bands);
  /* fill-rule MUST be declared. The page ink is evenodd, where overlapping
     contours in one path CANCEL - inheriting it would punch holes. */
  eq('5.3d fill-rule="nonzero" is set explicitly on the path element',
     band.path.getAttribute('fill-rule'), 'nonzero');
  eq('5.3e and it is on the element, not inherited from the page',
     getComputedStyle(band.path).fillRule, 'nonzero');
  /* the rendered shape must cover exactly the union of the per-line extents */
  {
    const u = band.boxes.reduce((a, b) => ({
      x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0),
      x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) }), band.boxes[0]);
    const bb = band.path.getBBox();
    const off = Math.max(Math.abs(bb.x - u.x0), Math.abs(bb.y - u.y0),
                         Math.abs(bb.x + bb.width - u.x1), Math.abs(bb.y + bb.height - u.y1));
    ok('5.3f the rendered bbox is the union of the per-line extents',
       off <= band.seam / 2 + 0.01,
       { off, seam: band.seam, bbox: [bb.x, bb.y, bb.width, bb.height], union: u });
    ok('5.3g the path has real area', bb.width > 10 && bb.height > 10, [bb.width, bb.height]);
  }
  /* adjacent subpaths must OVERLAP, or an antialiasing hairline shows as a seam */
  {
    const ys = [...band.d.matchAll(/M[-\d.]+ ([-\d.]+)H[-\d.]+V([-\d.]+)/g)]
                 .map(m => [Number(m[1]), Number(m[2])]).sort((a, b) => a[0] - b[0]);
    let touching = 0, overlapping = 0;
    for (let i = 0; i < ys.length - 1; i++) {
      if (ys[i][1] > ys[i + 1][0] + 1e-9) overlapping++;
      if (Math.abs(band.boxes.length) && Math.abs(ys[i][1] - ys[i + 1][0]) < 1) touching++;
    }
    ok('5.3h neighbouring subpaths overlap, killing the seam hairline',
       overlapping === ys.length - 1, { overlapping, of: ys.length - 1 });
    near('5.3i the overlap is exactly the seam allowance',
         ys[0][1] - ys[1][0], band.seam, 0.001);
  }

  /* a band on NON-ADJACENT lines must not grow tails into the lines between */
  {
    const far = p42.band([...p42.words({ line: 3 }), ...p42.words({ line: 9 })]);
    const ys = [...far.d.matchAll(/M[-\d.]+ ([-\d.]+)H[-\d.]+V([-\d.]+)/g)]
                 .map(m => [Number(m[1]), Number(m[2])]).sort((a, b) => a[0] - b[0]);
    eq('5.3j two far-apart lines still give one path with two subpaths',
       [far.el.children.length, ys.length], [1, 2]);
    ok('5.3k and they are NOT joined by a seam overlap',
       ys[0][1] < ys[1][0] - 1, [ys[0][1], ys[1][0]]);
    const pb = far.boxes.slice().sort((a, b) => a.y0 - b.y0);
    near('5.3l their edges are the untouched line pitch', ys[0][1], pb[0].y1, 0.001);
    far.remove();
  }
  band.remove();
  eq('5.5 band.remove() leaves nothing', p42.el.querySelectorAll('g.mushaf-band').length, 0);

  const hl = p42.highlight('2:255:1', { fill: '#c0392b' });
  ok('5.6 highlight recolours the ink', hl.paths.every(p => p.style.fill === 'rgb(192, 57, 43)'));
  hl.remove();
  ok('5.7 highlight.remove() restores exactly', hl.paths.every(p => !p.style.fill));

  const ha = p42.highlightAyah('2:255', { padX: 2, padY: 2, fill: '#0a7' });
  eq('5.8 highlightAyah bands every line', ha.bands, a255.lines.length);
  ha.remove();
  eq('5.9 and clears', p42.el.querySelectorAll('g.mushaf-band').length, 0);

  /* multi-fragment, multi-line handled on a page where it is extreme */
  const p48 = await load(48);
  const big = p48.ayah('2:282');
  const bigBand = p48.band('2:282');
  ok('5.10 a 15-line ayah bands every line it occupies',
     bigBand.bands === big.lines.length && bigBand.bands > 5, { bands: bigBand.bands, lines: big.lines.length });
  bigBand.remove();

  /* ============================================ 6. hit testing */
  const target = p42.word('2:255:5');
  const tb = target.box();
  const inside = p42.hitTest((tb.x0 + tb.x1) / 2, (tb.y0 + tb.y1) / 2, { space: 'view' });
  eq('6.1 a point on the ink hits its own word', [inside.wordKey, inside.exact], ['2:255:5', true]);

  /* a point in the GAP between two words of the same line */
  const line4 = p42.words({ line: 4 }).map(x => ({ w: x, b: x.box() }))
                   .sort((x, y) => y.b.x1 - x.b.x1);
  let gapCase = null;
  for (let i = 0; i < line4.length - 1; i++) {
    const gap = line4[i].b.x0 - line4[i + 1].b.x1;
    if (gap > 2.5) { gapCase = { prev: line4[i], next: line4[i + 1], gap }; break; }
  }
  ok('6.2 page 42 line 4 has a real gap to test', !!gapCase, gapCase && gapCase.gap);
  if (gapCase) {
    const y = (gapCase.prev.b.y0 + gapCase.prev.b.y1) / 2;
    const mid = (gapCase.prev.b.x0 + gapCase.next.b.x1) / 2;
    const h = p42.hitTest(mid, y, { space: 'view' });
    ok('6.3 a tap in the gap hits a word, not nothing', !!h && !h.exact, h && h.wordKey);
    /* direction: with the default bias the middle of the gap goes to the
       PRECEDING (right-hand) word, because its trailing ink drifts left */
    eq('6.4 the gap is awarded with direction, not naive nearest',
       h.wordKey, gapCase.prev.w.wordKey);
    const naive = p42.hitTest(mid, y, { space: 'view', gapBias: 0.5 });
    ok('6.5 gapBias actually moves the boundary',
       p42.hitTest(gapCase.prev.b.x0 - gapCase.gap * 0.45, y, { space: 'view', gapBias: 0.6 }).wordKey
       === gapCase.prev.w.wordKey);
    ok('6.6 far into the gap the following word wins',
       p42.hitTest(gapCase.next.b.x1 + gapCase.gap * 0.1, y, { space: 'view' }).wordKey === gapCase.next.w.wordKey);
  }
  /* a point far below the last line still resolves to the nearest line */
  const below = p42.hitTest(170, 545, { space: 'view' });
  ok('6.7 a point off the text block resolves to the nearest line', !!below, below && below.wordKey);
  ok('6.8 the reported distance is to the WORD box, not the line band',
     below.distance > 0, below.distance);
  eq('6.9 maxDistance can refuse a hit',

  /* spans land on the ink: compare each span's centre to its word's rect */

  let worst = 0;
  const origin16 = sel.layer.getBoundingClientRect();
  for (const s of sel.spans()) {

    const bands = [...rows.values()].sort((a, b) => a.top - b.top);

    for (let i = 0; i < bands.length - 1; i++) if (bands[i].bottom - bands[i + 1].top > 0.5) bad++;

     getComputedStyle(p42.el).pointerEvents, 'auto');
  cBand.remove();
  eq('19.17 hasHitLayer reports honestly', M.hasHitLayer(p42), false);

  /* the overlay-free path still works for a caller who opts out */
  const taps2 = [];
  const tapOnly = p42.onTap(r => taps2.push(r.wordKey));
  const tw = p42.word('2:254:1').el.getBoundingClientRect();
  p42.el.querySelector('g.word[data-word-key="2:254:1"] path')
      .dispatchEvent(new MouseEvent('click', { bubbles: true,
        clientX: tw.left + tw.width / 2, clientY: tw.top + tw.height / 2 }));
  eq('19.18 onTap works with no overlay at all', taps2, ['2:254:1']);
  tapOnly.remove();


  /* ============================================ 20. NO DEAD ZONES,
     one band per line, and word granularity. */
  show(p42);
  const dz = M.acquireHitLayer(p42);
  eq('20.1 one span per word', dz.count, 147);

  /* every point along a line belongs to exactly one word */
  {
    const lineNo = '4';
    const spans = dz.spans().filter(s => s.dataset.line === lineNo);
    const boxes = spans.map(s => s.getBoundingClientRect());
    const x0 = Math.min(...boxes.map(b => b.left)), x1 = Math.max(...boxes.map(b => b.right));
    const y = (boxes[0].top + boxes[0].bottom) / 2;
    let misses = 0, hits = 0;
    for (let x = x0 + 1; x < x1 - 1; x += 2) {
      const e = document.elementFromPoint(x, y);
      if (e && e.closest('.mushaf-hitlayer span')) hits++; else misses++;
    }
    eq('20.2 no dead zone anywhere along a printed line', misses, 0, );
    ok('20.3 (and it was actually probed)', hits > 100, hits);
    /* the extended boxes must tile, not overlap */
    const sorted = boxes.slice().sort((a, b) => a.left - b.left);
    let overlap = 0;
    for (let i = 0; i < sorted.length - 1; i++)
      if (sorted[i].right - sorted[i + 1].left > 0.5) overlap++;
    eq('20.4 hit boxes tile the line, they do not overlap', overlap, 0);
  }

  /* the hit box is WIDER than the ink box, and the ink box is still recorded */
  {
    const s = dz.spanOf('2:255:3'), w = p42.word('2:255:3');
    const hb = s.getBoundingClientRect(), ib = w.el.getBoundingClientRect();
    /* one word's hit box CAN be narrower than its ink: a mark may legitimately
       be drawn over the neighbouring word (FORMAT 9.9), so ink boxes overlap
       while hit boxes tile. What must hold is that the line as a whole is
       covered - checked at 20.2 - and that hit boxes are wider ON AVERAGE. */
    const line4 = dz.spans().filter(x => x.dataset.line === '4');
    const deltas = line4.map(x => x.getBoundingClientRect().width -
                                  p42.word(x.dataset.wordKey).el.getBoundingClientRect().width);
    const median = deltas.slice().sort((a, b) => a - b)[deltas.length >> 1];
    ok('20.5 hit boxes are wider than the ink they cover (median over a line)',
       median > 0, { median, sample: [hb.width, ib.width] });
    ok('20.6 the hit box is a full line band, taller than the word', hb.height >= ib.height - 0.5,
       [hb.height, ib.height]);
    const ink = s.dataset.ink.split(' ').map(Number);
    const origin = dz.layer.getBoundingClientRect();
    ok('20.7 the INK box travels with the span, for drawing',
       Math.abs(ink[0] - (ib.left - origin.left)) < 0.5 && Math.abs(ink[2] - ib.width) < 0.5,
       [ink, ib.left - origin.left, ib.width]);
  }

  /* a click landing between two words returns the nearer word, never null */
  {
    const spans = dz.spans().filter(s => s.dataset.line === '4')
                    .map(s => ({ s, r: s.getBoundingClientRect(),
                                 ink: p42.word(s.dataset.wordKey).el.getBoundingClientRect() }))
                    .sort((a, b) => b.ink.right - a.ink.right);
    let probed = 0, resolved = 0;
    for (let i = 0; i < spans.length - 1; i++) {
      const gap = spans[i].ink.left - spans[i + 1].ink.right;
      if (gap < 3) continue;
      probed++;
      const x = (spans[i].ink.left + spans[i + 1].ink.right) / 2;
      const y = (spans[i].ink.top + spans[i].ink.bottom) / 2;
      const r = dz.wordAt(x, y);
      if (r && (r.wordKey === spans[i].s.dataset.wordKey || r.wordKey === spans[i + 1].s.dataset.wordKey)) resolved++;
    }
    ok('20.8 there were real gaps to probe', probed > 3, probed);
    eq('20.9 a click in a gap always returns one of the two neighbours', resolved, probed);
  }
  dz.release();

  /* line-pitch bands: one per line, no overlap */
  {
    const b3 = p42.band('2:255');
    const lines3 = p42.ayah('2:255').lines.length;
    eq('20.10 one rect per printed line', b3.bands, lines3);
    const boxes = b3.boxes.slice().sort((a, b) => a.y0 - b.y0);
    let bad = 0;
    for (let i = 0; i < boxes.length - 1; i++) if (boxes[i].y1 - boxes[i + 1].y0 > 0.01) bad++;
    eq('20.11 pitch-derived bands stack flush, never overlapping', bad, 0);
    /* and they DO abut - no gaps either */
    let gaps = 0;
    for (let i = 0; i < boxes.length - 1; i++) if (boxes[i + 1].y0 - boxes[i].y1 > 0.01) gaps++;
    eq('20.12 and they abut, so a multi-line band is one ribbon', gaps, 0);
    /* horizontal extent comes from the INK, so nothing overhangs */
    const ink = p42.ayah('2:255').words().map(x => x.box());
    for (const bx of b3.boxes) {
      const onLine = ink.filter((_, i) => p42.ayah('2:255').words()[i].line === bx.line);
      const l = Math.min(...onLine.map(o => o.x0)), r = Math.max(...onLine.map(o => o.x1));
      if (Math.abs(bx.x0 - (l - 1.2)) > 0.01 || Math.abs(bx.x1 - (r + 1.2)) > 0.01) bad++;
    }
    eq('20.13 band width comes from the ink boxes, not the hit boxes', bad, 0);
    b3.remove();
  }

  /* word granularity: a mid-word range paints and copies whole words only */
  {
    const gsel = M.attachSelection(p42, { form: 'rasm_uthmani' });
    const a1 = gsel.spans().find(s => s.dataset.wordKey === '2:255:2');
    const a2 = gsel.spans().find(s => s.dataset.wordKey === '2:255:20');
    const r = document.createRange();
    /* deliberately start and end INSIDE the text nodes */
    r.setStart(a1.firstChild, 1);
    r.setEnd(a2.firstChild, 2);
    getSelection().removeAllRanges(); getSelection().addRange(r);
    let words = [];
    for (let i = 0; i < 20 && !words.length; i++) {
      await new Promise(res => setTimeout(res, 25));
      words = gsel.words();
    }
    R.granularityDebug = { n: words.length, rangeCount: getSelection().rangeCount,
                           collapsed: getSelection().isCollapsed,
                           spans: gsel.count, a1: !!a1, a2: !!a2 };
    ok('20.13b the mid-word range produced a selection', words.length > 0, R.granularityDebug);
    if (!words.length) throw new Error('no selection');
    ok('20.14 a mid-word range is snapped out to whole words',
       words[0].wordKey === '2:255:2' && words[words.length - 1].wordKey === '2:255:20', 
       [words[0]?.wordKey, words[words.length-1]?.wordKey]);
    eq('20.15 the copied text has exactly as many words as are highlighted',
       gsel.text('rasm_uthmani').split(/[\s\n]+/).length, words.length);
    const bandNow = gsel.band;
    const usedLines = [...new Set(words.map(x => x.line))];
    eq('20.16 the painted band is one rect per line of the selection',
       bandNow.bands, usedLines.length);
    ok('20.17 a three-line selection gives three rectangles', usedLines.length >= 3, usedLines.length);
    /* every band edge coincides with a word ink boundary */
    let offBy = 0;
    for (const bx of bandNow.boxes) {
      const on = words.filter(x => x.line === bx.line).map(x => x.box());
      const l = Math.min(...on.map(o => o.x0)), rr = Math.max(...on.map(o => o.x1));
      if (Math.abs((bx.x0 + 0.6) - l) > 0.01 || Math.abs((bx.x1 - 0.6) - rr) > 0.01) offBy++;
    }
    eq('20.18 every band edge coincides with a word ink boundary', offBy, 0);
    eq('20.19 native ::selection is suppressed, so no per-word notches',
       getComputedStyle(a1, '::selection').backgroundColor,
       'rgba(0, 0, 0, 0)');
    gsel.clear();
    eq('20.20 clearing the selection clears the band',
       p42.el.querySelectorAll('g.mushaf-selband').length, 0);
    gsel.detach();
  }

  /* ================================ 21. swappable ayah end-marks (markers.mjs)
   *
   * No marker outline ships with this repository — the set is fetched at
   * runtime and carries its sources' licences. So the deterministic assertions
   * run against a SYNTHETIC set served by a stub fetch, shaped exactly like the
   * real one: PRE-LAYERED, one <g data-part> per colourable part, each painting
   * with var(--<part>, <default>). Point the page at a real set with
   * ?markers=<url> and §21.50+ additionally check that set for conformance.  */
  {
    /* outer square 0..1000, inner square 200..800 punched back out of the ink
       layer by upstream — the file arrives already cut, and this module does
       not re-cut it */
    const OUTER = 'M0 0L1000 0L1000 1000L0 1000Z';
    const INNER = 'M200 200L200 800L800 800L800 200Z';
    const LAYERED = '<svg xmlns="http://www.w3.org/2000/svg" class="ayah-mark" ' +
      'viewBox="-50 -50 1100 1100">' +
      `<g data-part="fill-1" fill-rule="evenodd" style="fill:var(--fill-1,#fff8e7)"><path data-contours="1" d="${INNER}"/></g>` +
      `<g data-part="ink-base" fill-rule="evenodd" style="fill:var(--ink-base,#083a3a)"><path data-contours="0 1" d="${OUTER}${INNER}"/></g>` +
      '</svg>';
    const FAKE = {
      'collection.json': { name: 'stub', markers: [
        { id: '900-regular', codepoint: 'U+E900', file: 'markers/900.svg',
          width: 1000, upem: 1000,
          sources: [{ source: 'stub', family: 'Stub Sans', variant: '400' }] },
        /* same drawing, but this one tells us where it wants the number */
        { id: '900-anchor', codepoint: 'U+E902', file: 'markers/900.svg',
          width: 1000, upem: 1000,
          number: { cx: 300, cy: 650, width: 400, height: 400, r: 200 },
          sources: [{ source: 'stub', family: 'Stub Sans', variant: '400' }] },
        { id: '900-bold', codepoint: 'U+E901', file: 'markers/901.svg',
          width: 1000, upem: 1000, sources: [{ source: 'stub', family: 'Stub Sans', variant: '700' }] }
      ] },
      'markers/900.svg': LAYERED
      /* 900-bold is listed but its file is NOT served — the missing-file path */
    };
    let served = 0;
    const asked = [];
    const stub = async url => {
      served++;
      asked.push(String(url));
      const key = String(url).replace(/^stub:\/\//, '');
      if (!(key in FAKE)) return { ok: false, status: 404 };
      const body = FAKE[key];
      return { ok: true, status: 200, json: async () => body, text: async () => String(body) };
    };

    const set = await M.loadMarkSet('stub://', { fetch: stub });
    eq('21.1 the set lists its markers', set.ids(), ['900-regular', '900-anchor', '900-bold']);
    eq('21.2 designs are grouped, weights under them',
       set.families().map(f => [f.family, f.weights.length]), [['900', 3]]);
    eq('21.3 a marker names its source family, for the licence trail',
       set.record('900-regular').sources[0].family, 'Stub Sans');
    eq('21.4 the number record is carried through WHOLE — unknown fields and all',
       set.record('900-anchor').number,
       { cx: 300, cy: 650, width: 400, height: 400, r: 200 });
    eq('21.4b only cx/cy are read; the rest is the publisher\'s business',
       M.numberCentre(await set.outline('900-anchor')), { cx: 300, cy: 650 });
    eq('21.5 a design that publishes no centre says so', set.record('900-regular').number, undefined);

    const out = await set.outline('900-regular');
    eq('21.6 the parts come off the file itself, in the order it draws them',
       out.parts, ['fill-1', 'ink-base']);
    eq('21.7 one group per part, taken verbatim', out.groups.length, 2);
    ok('21.8 the counter is already punched out upstream — nothing is re-cut here',
       out.groups[1].querySelector('path').getAttribute('d').includes('M200 200'));
    ok('21.9 upstream\'s fill-rule is carried through, or the ring fills solid',
       out.groups.every(g => g.getAttribute('fill-rule') === 'evenodd'));
    eq('21.10 the outline box is measured, not taken from the padded viewBox',
       [out.box.x, out.box.y, out.box.w, out.box.h], [0, 0, 1000, 1000]);

    /* the index is fetched once however many outlines are pulled */
    const before = served;
    await set.outline('900-regular');
    eq('21.11 an outline is read once and cached', served, before);
    const same = await M.loadMarkSet('stub://', { fetch: stub });
    ok('21.12 the set itself is cached per URL', same === set);
    eq('21.13 annotations.json is never fetched — upstream ships the layers',
       asked.filter(u => u.includes('annotations')).length, 0);

    /* ---- the swap, on a real page ---- */
    const pm = show(await load(42));   /* rendered: getBBox and getComputedStyle need it */
    const mk = pm.ayahMarks()[0];
    const numeral = mk.numeral;
    const numBefore = { d: numeral.getAttribute('d'), box: JSON.stringify(numeral.getBBox()) };
    const numScreen = numeral.getBoundingClientRect();
    const ringD = mk.ring.getAttribute('d');
    /* SCREEN space on purpose: getBBox() on a <g> excludes the group's OWN
       transform, which is precisely the fit being tested. */
    const ringBox = mk.ring.getBoundingClientRect();

    const h = M.setAyahMark(pm, out, { colours: { 'ink-base': '#b08d2e' } });
    eq('21.14 every real medallion on the page was swapped', h.count, pm.ayahMarks().length);
    eq('21.15 the printed ring is gone from the medallion',
       mk.el.querySelectorAll('path[data-kind="ayah_mark_ornament"]').length, 0);

    const swap = mk.el.querySelector('g.ayah-mark-swap');
    const sb = swap.getBoundingClientRect();
    /* this design publishes no number centre, so it falls back to box-centring
       on the ring it replaced; the fit is uniform, so the shorter axis matches
       exactly and the other is centred inside */
    near('21.16 with no published centre the swap is centred on the ring (x)',
         sb.x + sb.width / 2, ringBox.x + ringBox.width / 2, 0.5);
    near('21.17 with no published centre the swap is centred on the ring (y)',
         sb.y + sb.height / 2, ringBox.y + ringBox.height / 2, 0.5);
    ok('21.18 the swap fits inside the ring\'s box, touching on one axis',
       sb.width <= ringBox.width + 0.5 && sb.height <= ringBox.height + 0.5 &&
       (Math.abs(sb.width - ringBox.width) < 0.5 || Math.abs(sb.height - ringBox.height) < 0.5),
       [sb.width, sb.height, ringBox.width, ringBox.height]);

    eq('21.19 the numeral is untouched — same d, same box',
       [numeral.getAttribute('d'), JSON.stringify(numeral.getBBox())],
       [numBefore.d, numBefore.box]);
    near('21.20 and it has not moved on screen either (x)',
         numeral.getBoundingClientRect().x, numScreen.x, 0.01);
    near('21.21 and it has not moved on screen either (y)',
         numeral.getBoundingClientRect().y, numScreen.y, 0.01);

    /* ---- recolouring, entirely through upstream's custom properties ---- */
    const parts = [...swap.querySelectorAll('[data-part]')].map(p => p.getAttribute('data-part'));
    eq('21.22 every part is its own element, addressable', parts, ['fill-1', 'ink-base']);
    ok('21.23 every part reads UPSTREAM\'s custom property name',
       [...swap.querySelectorAll('[data-part]')].every(
         p => p.getAttribute('style').includes('var(--' + p.getAttribute('data-part') + ',')));
    ok('21.24 and none of them reads the retired --ayah-mark-* name',
       !new XMLSerializer().serializeToString(swap).includes('--ayah-mark-'));
    {
      const ink = swap.querySelector('[data-part="ink-base"]');
      const fill = swap.querySelector('[data-part="fill-1"]');
      eq('21.25 a colour passed in is set as the custom property, and paints',
         getComputedStyle(ink.querySelector('path')).fill, 'rgb(176, 141, 46)');
      eq('21.26 the page carries it as --ink-base, upstream\'s own name',
         pm.el.style.getPropertyValue('--ink-base').trim(), '#b08d2e');
      eq('21.27 a part nobody set keeps the design\'s baked-in default',
         getComputedStyle(fill.querySelector('path')).fill, 'rgb(255, 248, 231)');
      const c = M.colourAyahMarks(pm, { 'fill-1': '#123456' });
      eq('21.28 setting the custom property alone recolours it, no JS on the shape',
         getComputedStyle(fill.querySelector('path')).fill, 'rgb(18, 52, 86)');
      c.remove();
      eq('21.29 removing it falls back to the design\'s default again',
         getComputedStyle(fill.querySelector('path')).fill, 'rgb(255, 248, 231)');
    }

    /* ---- reset ---- */
    eq('21.30 the page reports it is showing swapped markers', M.hasSwappedMarks(pm), true);
    const r1 = M.resetAyahMarks(pm);
    eq('21.31 reset restores every medallion', r1.count, h.count);
    eq('21.32 reset restores the printed ring EXACTLY, not approximately',
       pm.ayahMarks()[0].ring.getAttribute('d'), ringD);
    eq('21.33 nothing is left over', pm.el.querySelectorAll('g.ayah-mark-swap').length, 0);
    eq('21.34 the numeral survived the round trip untouched',
       [numeral.getAttribute('d'), JSON.stringify(numeral.getBBox())],
       [numBefore.d, numBefore.box]);
    /* the handle's own remove() is the same restoration, and takes the colours
       back off with it */
    M.colourAyahMarks(pm, { 'ink-base': null });   /* clear §21.14's, which
       resetAyahMarks deliberately does not touch — it restores rings, not
       colours — so the next handle starts from an unset property */
    M.setAyahMark(pm, out, { colours: { 'ink-base': '#010203' } }).remove();
    eq('21.35 the handle restores the ring too', pm.ayahMarks()[0].ring.getAttribute('d'), ringD);
    eq('21.36 and unsets the custom properties it set',
       pm.el.style.getPropertyValue('--ink-base').trim(), '');

    /* ---- the number anchor: the marker moves, the number never does ---- */
    {
      const p = show(await load(42));
      const m0 = p.ayahMarks()[0];
      const nb = m0.numeral.getBoundingClientRect();
      const anchored = await set.outline('900-anchor');
      const hh = M.setAyahMark(p, anchored);
      const sw = m0.el.querySelector('g.ayah-mark-swap');
      eq('21.37 an anchored swap says so — a flag, not a provenance label',
         sw.getAttribute('data-anchored'), 'numeral');
      /* the design's own (300, 650) must land on the printed numeral's centre,
         and that comparison is only meaningful in SCREEN space — the outline,
         the ring and the numeral are three different coordinate systems */
      const ctm = sw.getScreenCTM();
      const pt = p.el.createSVGPoint();
      pt.x = 300; pt.y = 650;
      const got = pt.matrixTransform(ctm);
      near('21.38 the design\'s own number-centre lands on the printed numeral (x)',
           got.x, nb.x + nb.width / 2, 1);
      near('21.39 the design\'s own number-centre lands on the printed numeral (y)',
           got.y, nb.y + nb.height / 2, 1);
      near('21.40 and the numeral itself did not move (x)',
           m0.numeral.getBoundingClientRect().x, nb.x, 0.01);
      near('21.41 and the numeral itself did not move (y)',
           m0.numeral.getBoundingClientRect().y, nb.y, 0.01);
      /* anchorOnNumber:false is the old box-on-box behaviour, still reachable */
      hh.remove();
      const h2 = M.setAyahMark(p, anchored, { anchorOnNumber: false });
      ok('21.42 anchorOnNumber:false falls back to box-centring',
         !m0.el.querySelector('g.ayah-mark-swap').hasAttribute('data-anchored'));
      h2.remove();
    }

    /* ---- targeting ---- */
    {
      const p = await load(42);
      const one = p.ayahMarks()[0].ayahKey;
      const hh = M.setAyahMark(p, out, { target: one });
      eq('21.43 a target swaps that ayah and no other', hh.count, 1);
      eq('21.44 the others still hold their printed ring',
         p.el.querySelectorAll('path[data-kind="ayah_mark_ornament"]').length,
         p.ayahMarks().length - 1);
      hh.remove();
    }

    /* ---- pages 1-2: every group has an ayah; the doubled ring is INSIDE it ---- */
    {
      const p = await load(1);
      eq('21.45 page 1: no marker group without data-ayah-key (every one closes an ayah)',
         p.ayahMarkGroups().filter(g => !g.dataset.ayahKey).length, 0);
      const before = p.ayahMarks().map(m => m.el.innerHTML);
      const hh = M.setAyahMark(p, out);
      eq('21.46 all seven medallions were swapped', hh.count, 7);
      eq('21.47 the doubled ring is hidden with the ring it copies',
         p.ayahMarks().every(m => m.ringCopies.length === 1 && m.ringCopies[0].getAttribute('display') === 'none'), true);
      hh.remove();
      eq('21.48 remove() restores the group exactly', p.ayahMarks().map(m => m.el.innerHTML), before);
      const h2 = M.setAyahMark(p, out, { decorative: true });
      eq('21.49 decorative:true changes nothing on a current page', h2.count, 7);
      h2.remove();
    }

    /* ---- the size factor ---- */
    {
      const p = show(await load(42));
      const swapBox = f => {
        const hh = M.setAyahMark(p, out, { size: f });
        const b = p.ayahMarks()[0].el.querySelector('g.ayah-mark-swap').getBoundingClientRect();
        hh.remove();
        return b;
      };
      const full = swapBox(1), half = swapBox(0.5);
      near('21.60 size scales the fitted outline', half.height, full.height / 2, 0.5);
      near('21.61 and does it uniformly', half.width, full.width / 2, 0.5);
    }

    /* ---- offline / a URL that moved ---- */
    {
      const dead = async () => { throw new TypeError('Failed to fetch'); };
      let msg = '';
      try { await M.loadMarkSet('https://nowhere.invalid/set/', { fetch: dead }); }
      catch (e) { msg = e.message; }
      ok('21.62 an unreachable set rejects with the URL in the message',
         msg.includes('https://nowhere.invalid/set/collection.json'), msg);
      /* and it is NOT cached, so a retry when the network comes back works */
      const good = await M.loadMarkSet('https://nowhere.invalid/set/', {
        fetch: async u => stub(String(u).replace('https://nowhere.invalid/set/', '')) });
      eq('21.63 a failed load is not cached — a retry can succeed', good.ids().length, 3);

      let m2 = '';
      try { await set.outline('nope'); } catch (e) { m2 = e.message; }
      ok('21.64 an unknown marker id says so', /no marker "nope"/.test(m2), m2);

      let m3 = '';
      try { await set.outline('900-bold'); } catch (e) { m3 = e.message; }
      eq('21.65 the missing-file path is reachable and reported', m3.slice(0, 8), 'HTTP 404');

      let m5 = '';
      try { M.numberCentre({ id: 'z', number: { width: 10 } }); } catch (e) { m5 = e.message; }
      ok('21.67 a number record with no usable cx/cy throws instead of guessing',
         /no usable cx\/cy/.test(m5), m5);
      eq('21.68 but NO record at all is legitimate — box-centre it',
         M.numberCentre({ id: 'z' }), null);

      let m4 = '';
      try { M.readOutline('<svg xmlns="http://www.w3.org/2000/svg"><path d="M0 0Z"/></svg>', { id: 'x' }); }
      catch (e) { m4 = e.message; }
      ok('21.66 a file with no data-part groups is rejected, not drawn blank',
         /no <g data-part>/.test(m4), m4);
    }

    /* ---- conformance of a REAL set, only when one is pointed at ---- */
    const MURL = q.get('markers');
    if (MURL) {
      const real = await M.loadMarkSet(MURL);
      const ids = real.ids();
      ok('21.50 the real set loaded', ids.length > 0, ids.length);
      let empty = 0, unvar = 0, noCentre = 0, badBox = 0;
      for (const id of ids) {
        const o = await real.outline(id);
        if (!o.parts.length) empty++;
        if (!(o.box.w > 0 && o.box.h > 0)) badBox++;
        if (!M.numberCentre(o)) noCentre++;
        for (const g of o.groups)
          if (!String(g.getAttribute('style')).includes('var(--' + g.getAttribute('data-part') + ','))
            unvar++;
      }
      eq('21.51 every marker arrives already layered', empty, 0);
      eq('21.52 every marker measures a real box', badBox, 0);
      eq('21.53 every part paints through its own custom property', unvar, 0);
      eq('21.54 every marker publishes a single number centre', noCentre, 0);
    }
  }
  /* ============================================ 22. THE ONE-CALL ENTRY POINTS
     reveal(), wordTooltip() and followRecitation() each collapse a whole demo
     into one call. What is tested here is the part the caller can no longer
     see: the step order, the medallion rule, the placement, and the guard
     that refuses to zip two disagreeing word counts together. */
  show(p42);
  const fill = el => [...el.querySelectorAll('path')].filter(p => p.style.fill).length;

  const rev = M.reveal(p42, { lit: 3 });
  eq('22.1 one step per word, in reading order',
     [rev.count, rev.steps[0], rev.steps[146]], [147, p42.words()[0].wordKey, p42.words()[146].wordKey]);
  const revA = M.reveal(p42, { byAyah: true });
  eq('22.2 by ayah instead', revA.steps, p42.ayahKeys());
  revA.remove();
  rev.goto(5);
  const inked = [...p42.el.querySelectorAll('g.word')].filter(g => fill(g)).map(g => g.dataset.wordKey);
  eq('22.3 exactly `lit` steps are inked, ending at the position',
     inked, rev.steps.slice(3, 6));
  eq('22.4 and the handle reports where it is', [rev.at, rev.key], [5, rev.steps[5]]);

  /* a medallion belongs to the ayah it CLOSES */
  const firstAid = p42.ayahKeys()[0];
  const closesAt = rev.closes.get(firstAid);
  const medal = p42.ayah(firstAid).mark;
  rev.goto(closesAt - 1);
  const dark = fill(medal);
  rev.goto(closesAt);
  ok('22.5 a medallion lights only once its ayah is finished',
     dark === 0 && fill(medal) > 0, { before: dark, after: fill(medal) });

  rev.remove();
  eq('22.6 remove() puts every path back', fill(p42.el), 0);

  /* ---- wordTooltip: the library owns the placement, not the look ---- */
  const seen = [];
  const tip = M.wordTooltip(p42, w => { seen.push(w.wordKey); return '<b>' + w.wordKey + '</b>'; },
                            { className: 'q-tip-test', mount: stage });
  eq('22.7 the tip carries the caller class and nothing else', tip.el.className, 'q-tip-test');
  eq('22.8 placement needs exactly one inline rule of ours',
     [tip.el.parentElement === stage, tip.el.style.position], [true, 'absolute']);

  const hoverBox = p42.word('2:255:3').el.getBoundingClientRect();
  const at = (x, y) => stage.dispatchEvent(new PointerEvent('pointermove',
    { clientX: x, clientY: y, bubbles: true }));
  at(hoverBox.left + hoverBox.width / 2, hoverBox.top + hoverBox.height / 2);
  eq('22.9 hovering a word renders and shows the tip',
     [seen, tip.el.classList.contains('on'), tip.el.textContent], [['2:255:3'], true, '2:255:3']);
  at(hoverBox.left + hoverBox.width / 2, hoverBox.top + hoverBox.height / 2 + 1);
  eq('22.10 it renders ONCE per word entered, not per pointermove', seen.length, 1);
  ok('22.11 the tip is placed inside the stage, not off it',
     parseFloat(tip.el.style.left) >= 4 - 0.01 &&
     parseFloat(tip.el.style.left) + tip.el.offsetWidth <= stage.getBoundingClientRect().width + 0.01,
     tip.el.style.left);
  at(-500, -500);
  eq('22.12 leaving every word hides it', tip.el.classList.contains('on'), false);
  tip.remove();
  eq('22.13 remove() takes the element with it', stage.querySelectorAll('.q-tip-test').length, 0);

  /* ---- followRecitation: the guard, without a network or a speaker ---- */
  const aidA = p42.ayahKeys()[0], aidB = p42.ayahKeys()[1];
  const nA = p42.ayah(aidA).words().length;
  const stub = {
    [aidA]: ['a.mp3', Array.from({ length: nA }, (_, i) => [i * 500, i * 500 + 400])],
    [aidB]: ['b.mp3', [[0, 900]]]                    /* deliberately the wrong count */
  };
  const foll = await M.followRecitation(p42, { timings: stub, paint: false });
  eq('22.14 the join keeps the page order and drops nothing',
     foll.ayahs.map(a => a.ayahKey), [aidA, aidB]);
  eq('22.15 a word-count disagreement is REPORTED, never zipped',
     foll.mismatches, [{ ayahKey: aidB, ours: p42.ayah(aidB).words().length, theirs: 1 }]);
  eq('22.16 and that ayah is followed whole while the other is per word',
     foll.ayahs.map(a => a.perWord), [true, false]);
  eq('22.17 segments totalled across the page', foll.segments, nA + 1);
  eq('22.18 nothing plays until play() is called', [foll.playing, foll.index], [false, -1]);
  foll.remove();
  eq('22.19 remove() leaves the ink untouched', fill(p42.el), 0);

  let refused = null;
  try { await M.followRecitation(p42, { timings: { '99:99': ['x', []] } }); }
  catch (e) { refused = e.message; }
  ok('22.20 timings that cover none of this page are an error, not a silent no-op',
     !!refused, refused);

  /* ============================ 23. another mushaf's ornaments (ornaments.mjs)
   *
   * No ornament ships with this repository — the set is fetched at runtime and
   * is `redistributable: false` while its publishers are asked for permission.
   * So the assertions run against a SYNTHETIC set served by a stub fetch,
   * shaped exactly like the real one: a catalog.json of typed records with a
   * palette, a data-slot and (for the border) slices, and assets that layer
   * with <g data-part> and mirror themselves with <use>.                     */
  {
    /* every asset draws one quadrant and mirrors it — the <use> case that
       makes a stylesheet the wrong tool for recolouring these */
    const asset = (slot, w, extra = '') =>
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' 100" ' +
      'data-slot="' + slot + '">' +
      '<metadata>{"provenance":"a blob repeated in the catalogue"}</metadata>' +
      '<defs><g id="q">' +
      '<g class="slot" data-part="slot" fill="none"><path d="M0 0h10v10h-10Z"/></g>' +
      '<g class="c1" data-part="c1" fill="#ffffff"><path d="M0 0h5v5h-5Z"/></g>' +
      '<g class="line" data-part="line" fill="none" stroke="#303641"><path d="M0 0h' + w + 'v100"/></g>' +
      '</g></defs><use href="#q"/><use href="#q" transform="matrix(-1 0 0 1 ' + w + ' 0)"/>' +
      extra + '</svg>';
    /* a slice carries the sliver of the text area its crop cut through */
    const slice = (w, h) =>
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<g class="slot" data-part="slot" fill="none"><path d="M0 0h1v1h-1Z"/></g>' +
      '<g class="c1" data-part="c1" fill="#ffffff"><path d="M0 0h' + w + 'v' + h + 'h-' + w + 'Z"/></g>' +
      '<g class="line" data-part="line" fill="none" stroke="#303641"><path d="M0 0h' + w + '"/></g></svg>';

    const PAL = [{ name: 'slot', hex: 'none' }, { name: 'c1', hex: '#ffffff' },
                 { name: 'line', hex: '#303641', stroke: true }];
    const CAT = { assets: [
      { id: 'ayah-markers/stubi', type: 'ayah-markers', style: 'stubi', riwayah: 'Stub',
        viewBox: '0 0 60 100', palette: PAL,
        variants: { color: 'assets/ayah-markers/stubi/color.svg' },
        license: { id: 'CC-BY-NC-SA-4.0', status: 'provisional', redistributable: false } },
      { id: 'surah-headers/stubi', type: 'surah-headers', style: 'stubi', palette: PAL,
        variants: { color: 'assets/surah-headers/stubi/color.svg' },
        license: { id: 'CC-BY-NC-SA-4.0', status: 'provisional', redistributable: false } },
      { id: 'page-frames/stubi', type: 'page-frames', style: 'stubi', palette: PAL,
        variants: { color: 'assets/page-frames/stubi/color.svg' },
        slices: { files: { corner: 'assets/page-frames/stubi/slices/corner.svg',
                           'edge-h': 'assets/page-frames/stubi/slices/edge-h.svg',
                           'edge-v': 'assets/page-frames/stubi/slices/edge-v.svg' },
                  corner: { w: 10, h: 8 }, repeat: { h: 6, v: 6 }, corner_mode: 'mirror' },
        license: { id: 'CC-BY-NC-SA-4.0', status: 'provisional', redistributable: false } },
      /* a second mushaf whose border does NOT tile: no slices to assemble */
      { id: 'page-frames/plain', type: 'page-frames', style: 'plain', palette: PAL,
        variants: { color: 'assets/page-frames/plain/color.svg' },
        license: { id: 'CC-BY-NC-SA-4.0', status: 'provisional', redistributable: false } }
    ] };
    const FILES = {
      'catalog.json': CAT,
      'assets/ayah-markers/stubi/color.svg': asset('12 22 36 56', 60),
      'assets/surah-headers/stubi/color.svg': asset('180 8 500 84', 860),
      'assets/page-frames/stubi/color.svg': asset('5 5 57 89', 68),
      'assets/page-frames/plain/color.svg': asset('5 5 57 89', 68),
      'assets/page-frames/stubi/slices/corner.svg': slice(10, 8),
      'assets/page-frames/stubi/slices/edge-h.svg': slice(6, 5),
      'assets/page-frames/stubi/slices/edge-v.svg': slice(5, 6)
    };
    let served = 0;
    const asked = [];
    const stub = async url => {
      served++; asked.push(String(url));
      const key = String(url).replace(/^orn:\/\//, '');
      if (!(key in FILES)) return { ok: false, status: 404 };
      const body = FILES[key];
      return { ok: true, status: 200, json: async () => body, text: async () => String(body) };
    };

    const oset = await M.loadOrnamentSet('orn://', { fetch: stub });
    eq('23.1 the set lists the mushafs it holds', oset.styles(), ['plain', 'stubi']);
    eq('23.2 a record is found by OUR name for the concept',
       oset.record('ayahMark', 'stubi').id, 'ayah-markers/stubi');
    eq('23.3 and by the catalogue\'s own type string, for a caller reading it directly',
       oset.record('surah-headers', 'stubi').id, 'surah-headers/stubi');
    eq('23.4 the licence is handed through whole, so a caller can honour it',
       oset.licence('stubi'),
       { id: 'CC-BY-NC-SA-4.0', status: 'provisional', redistributable: false });

    const orn = await oset.ornaments('stubi');
    eq('23.5 all three parts, under the library\'s vocabulary',
       ['ayahMark', 'surahBanner', 'pageBorder'].map(k => !!orn[k]), [true, true, true]);
    eq('23.6 the parts a picker should offer come off the catalogue palette',
       orn.parts, ['slot', 'c1', 'line']);
    eq('23.7 data-slot is read into the asset\'s own units',
       orn.surahBanner.slot, { x: 180, y: 8, w: 500, h: 84 });
    ok('23.8 the provenance blob is dropped, not cloned once per medallion',
       !orn.ayahMark.nodes.some(n => n.nodeName === 'metadata'));
    ok('23.9 FILE-LOCAL ids are renamed, and the <use> that mirrors them follows',
       (() => {
         const wrap = document.createElement('div');
         for (const n of orn.ayahMark.nodes) wrap.appendChild(n.cloneNode(true));
         const id = wrap.querySelector('[id]').id;
         return id !== 'q' && [...wrap.querySelectorAll('use')]
           .every(u => u.getAttribute('href') === '#' + id);
       })());
    eq('23.10 the border\'s slices are read too, corner and both repeat units',
       Object.keys(orn.pageBorder.slices.art).sort(), ['corner', 'edge-h', 'edge-v']);

    const before = served;
    await oset.ornaments('stubi');
    eq('23.11 a style is read once and cached', served, before);
    const same = await M.loadOrnamentSet('orn://', { fetch: stub });
    ok('23.12 the set itself is cached per URL', same === oset);

    /* ---- dressing a real page ---- */
    const po = show(await load(604));            /* three banners, 15 medallions */
    const vbWas = po.el.getAttribute('viewBox');
    const numerals = po.ayahMarks().map(m => m.numeral.getAttribute('d'));
    const h = M.dressPage(po, orn, { gap: 5 });

    eq('23.13 one medallion per printed ring, and one banner per printed name',
       [h.ayahMarks, h.surahBanners], [po.ayahMarks().length, po.el.querySelectorAll('g.surah-name').length]);
    ok('23.14 the border is assembled from slices, not stretched',
       h.border && !h.stretched && h.repeats > 4, { repeats: h.repeats, stretched: h.stretched });
    eq('23.15 nothing was missing for this style', h.missing, []);
    ok('23.16 the ornaments are ONE group at the FRONT, so they render behind the print',
       po.el.firstElementChild === h.el && h.el.classList.contains('mushaf-ornaments'));
    eq('23.17 the printed rings are hidden, not removed',
       po.ayahMarks().every(m => m.ring.getAttribute('display') === 'none' && m.ring.isConnected), true);
    eq('23.18 THE PRINTED NUMERALS ARE UNTOUCHED — this module never draws a number',
       po.ayahMarks().map(m => m.numeral.getAttribute('d')), numerals);
    ok('23.19 the border grew the page rather than covering a word',
       (() => { const v = po.viewBox; return v.x < 0 && v.y < 0 && v.w > 345 && v.h > 550; })(),
       po.el.getAttribute('viewBox'));
    eq('23.20 an assembled border keeps no slot — the slivers a crop cut through',
       h.el.querySelector('defs [id^="mushaf-slice-"] [data-part="slot"]'), null);
    ok('23.20b but a WHOLE asset keeps its slot: the banner\'s name window is real',
       h.el.querySelector('[data-part="slot"]') !== null);
    eq('23.21 the page\'s own ink is not touched at all',
       po.el.querySelectorAll('g.word path').length,
       (await load(604)).el.querySelectorAll('g.word path').length);

    /* ---- colour is an attribute, because a <use> is a shadow copy ---- */
    const paint = M.colourOrnaments(po, { c1: '#123456', line: '#654321' });
    ok('23.22 a fill part is painted on the ORIGINAL, so every <use> copy follows',
       [...h.el.querySelectorAll('[data-part="c1"]')].every(g => g.getAttribute('fill') === '#123456'));
    ok('23.23 the `line` part is a stroke, not a fill',
       [...h.el.querySelectorAll('[data-part="line"]')].every(
         g => g.getAttribute('stroke') === '#654321' && g.getAttribute('fill') === 'none'));
    paint.remove();
    ok('23.24 removing the paint restores the design\'s own colours',
       [...h.el.querySelectorAll('[data-part="c1"]')].every(g => g.getAttribute('fill') === '#ffffff'));

    h.remove();
    eq('23.25 remove() takes the layer away', M.hasOrnaments(po), false);
    eq('23.26 remove() puts every printed ring back, byte for byte',
       po.ayahMarks().every(m => m.ring.getAttribute('display') === null), true);
    eq('23.27 remove() restores the viewBox the border grew', po.el.getAttribute('viewBox'), vbWas);

    /* ---- line art keeps one group and needs no second file ---- */
    const fetchesBefore = served;
    const hl = M.dressPage(po, orn, { lineArt: true });
    eq('23.28 line art drops every fill part and keeps the strokes',
       [hl.el.querySelectorAll('[data-part]:not([data-part="line"])').length,
        hl.el.querySelectorAll('[data-part="line"]').length > 0], [0, true]);
    eq('23.29 and fetches nothing — the colour file already carries the strokes',
       served, fetchesBefore);
    ok('23.30 including the TILED border, which line.svg could not have given',
       hl.el.querySelector('svg[preserveAspectRatio="none"] [data-part="line"]') !== null);
    M.resetOrnaments(po);
    eq('23.31 resetOrnaments undoes it the same way', M.hasOrnaments(po), false);

    /* ---- parts a page or a style does not have ---- */
    const p42o = show(await load(42));           /* no surah banner on this page */
    const h42 = M.dressPage(p42o, orn);
    eq('23.32 a page with no printed surah name simply gets no banner',
       [h42.surahBanners, h42.missing], [0, []]);
    h42.remove();

    const plain = await oset.ornaments('plain');
    const hp = M.dressPage(po, plain);
    ok('23.33 a border with no slices is scaled whole, and SAYS so',
       hp.stretched === true && hp.border === true);
    eq('23.34 and the parts this style does not publish are reported, not faked',
       hp.missing, ['surahBanner', 'ayahMark']);
    hp.remove();

    let rejected = null;
    try { await oset.ornaments('nope'); } catch (e) { rejected = e.message; }
    ok('23.35 an unknown mushaf is an error naming the set, not an empty pane',
       !!rejected && rejected.includes('orn://'), rejected);
    show(p42);
  }

  /* left up on purpose for the interactive drag / resize probes */
  show(p42);
  const live = M.attachSelection(p42, { form: 'rasm_uthmani', citation: true });
  window.__SEL__ = live; window.__P42__ = p42;
  window.__HOVER__ = [];
  window.__HOVERBIND__ = M.onWordHover(p42, r => window.__HOVER__.push(r.wordKey));

} catch (e) {
  R.errors.push('THREW: ' + (e && e.stack || e));
  ok('run completed without throwing', false, String(e));
}
  R.done = true;
  const h = document.createElement('h4');
  h.textContent = `${R.pass} passed, ${R.fail} failed, ${R.errors.length} errors`;
  document.body.appendChild(h);
}
run();
</script>
