# Does every word hold the marks its text spells? Asked of all 604 pages.
#
# terminology.yml is the gate that needs nothing but this repository. This one
# needs the page artwork — 494 MB of hafs/kfqc from quranpedia/quran-svg, pinned
# at v1.1.1 (3ff27b46) — so it was left as a local command for a long time, and that is
# exactly how p540 shipped broken in v1.0.1: `tools/audit_marks.py` flags that
# page in three places, and nobody ran it. A gate that lives only in a README is
# not a gate.
#
# The artwork and the quran.com word cache are both restored from the Actions
# cache, so only the first run pays for them. Budget roughly 35 minutes cold and
# 25 warm; the audit itself is the bulk of it, not the download.
name: mushaf audit

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'conformance/test_page_frames.py'
      - 'conformance/test_qcf_v1_map.py'
      - 'conformance/test_qcf_v1_svg.py'
      - 'conformance/test_qcf_v1_division_sajdah.py'
      - 'conformance/test_qcf_v1_waqf_source.py'
      - 'conformance/qcf-v1-waqf-source-glyphs.json'
      - 'conformance/test_qcf_v1_v4_headers.py'
      - 'conformance/test_qcf_v1_hq_word_overlay.py'
      - 'conformance/qcf-v1-hq-word-source.json'
      - 'conformance/qcf-v1-vector-source.json'
      - 'conformance/qcf-v1-division-sajdah-source.json'
      - 'tools/build_qcf_v1_svg.py'
      - 'conformance/qcf-v1-source.json'
      - 'docs/QCF-V1.md'
      - 'conformance/test_surah_ornaments.py'
      - 'conformance/test_page121_ownership.py'
      - 'conformance/page-frames.json'
      - 'conformance/surah-ornaments.json'
      - '.cache/**'
      - '.github/workflows/mushaf-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'conformance/test_page_frames.py'
      - 'conformance/test_qcf_v1_map.py'
      - 'conformance/test_qcf_v1_svg.py'
      - 'conformance/test_qcf_v1_division_sajdah.py'
      - 'conformance/test_qcf_v1_waqf_source.py'
      - 'conformance/qcf-v1-waqf-source-glyphs.json'
      - 'conformance/test_qcf_v1_v4_headers.py'
      - 'conformance/test_qcf_v1_hq_word_overlay.py'
      - 'conformance/qcf-v1-hq-word-source.json'
      - 'conformance/qcf-v1-vector-source.json'
      - 'conformance/qcf-v1-division-sajdah-source.json'
      - 'tools/build_qcf_v1_svg.py'
      - 'conformance/qcf-v1-source.json'
      - 'docs/QCF-V1.md'
      - 'conformance/test_surah_ornaments.py'
      - 'conformance/test_page121_ownership.py'
      - 'conformance/page-frames.json'
      - 'conformance/surah-ornaments.json'
      - '.cache/**'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Page range, e.g. "1 604" or "540 540"'
        default: '1 604'

env:
  # quranpedia/quran-svg, the commit CLAUDE.md pins the decomposition to
  ARTWORK_COMMIT: 3ff27b46cecb0c0519d77531d9c868a579d1f623
  ARTWORK: ${{ github.workspace }}/../artwork

jobs:
  marks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Line preparation needs brotli. Native frames use MuPDF to read the official
      # AI pages, then FontTools pens plus Skia path boolean operations.
      - name: Artwork geometry dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mupdf-tools
          pip install --quiet \
            brotli fonttools skia-pathops \
            numpy==2.3.4 pillow==12.0.0 scipy==1.16.2

      - name: Mushaf preparation contracts
        run: |
          python conformance/test_qcf_v1_map.py
          python conformance/test_qcf_v1_svg.py
          python conformance/test_qcf_v1_division_sajdah.py
          python conformance/test_qcf_v1_waqf_source.py
          python conformance/test_qcf_v1_v4_headers.py
          python conformance/test_qcf_v1_hq_word_overlay.py
          python3 conformance/test_page_frames.py
          python3 conformance/test_surah_ornaments.py

      # The word cache is 604 files of quran.com API responses. It is
      # gitignored as derived, and re-fetching it on every run would hammer a
      # third party for data that never changes.
      - name: Restore the quran.com word cache
        uses: actions/cache@v4
        with:
          path: .cache/words
          key: words-v1

      # The cached tree carries both derived line structure and native frames. Any
      # change to either preparation stage or to the pinned source manifest invalidates it.
      - name: Restore the prepared artwork
        id: artwork-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ARTWORK }}
          key: artwork-${{ env.ARTWORK_COMMIT }}-${{ hashFiles('tools/add_line_structure.py', 'tools/svg_lines.py', 'tools/add_surah_ornaments.py', 'tools/prepare_page_frames.py', 'tools/prepare_surah_ornaments.py', 'conformance/page-frames.json', 'conformance/surah-ornaments.json') }}

      - name: Restore the official page-frame sources
        if: steps.artwork-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/page-frames
          key: page-frame-sources-${{ hashFiles('conformance/page-frames.json') }}

      - name: Restore the official surah-frame sources
        if: steps.artwork-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/surah-ornaments
          key: surah-ornament-sources-${{ hashFiles('conformance/surah-ornaments.json') }}

      - name: Fetch and prepare the artwork
        if: steps.artwork-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Only hafs/kfqc is decomposed here; the other four mushafs are a
          # different print and would quadruple the download for nothing.
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/quranpedia/quran-svg.git "$ARTWORK"
          cd "$ARTWORK"
          git sparse-checkout init --cone
          git sparse-checkout set mushafs/hafs/kfqc
          git fetch --depth 1 origin "$ARTWORK_COMMIT"
          git checkout "$ARTWORK_COMMIT"
          ln -sfn "$GITHUB_WORKSPACE/tools" tools
          ln -sfn "$GITHUB_WORKSPACE/.cache" .cache
          python3 tools/add_line_structure.py --mushaf hafs/kfqc --jobs 4
          python3 tools/prepare_page_frames.py --root "$ARTWORK" --jobs 8
          python3 tools/prepare_surah_ornaments.py --root "$ARTWORK" --jobs 8

      - name: Relink the working set into the cached artwork
        run: |
          set -euo pipefail
          cd "$ARTWORK"
          ln -sfn "$GITHUB_WORKSPACE/tools" tools
          ln -sfn "$GITHUB_WORKSPACE/.cache" .cache

      - name: Every native frame has its manifest owner
        env:
          QSVG_ROOT: ${{ env.ARTWORK }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "tools")
          from prepare_page_frames import check_prepared_artwork as check_page_frames
          from prepare_surah_ornaments import check_prepared_artwork as check_surah_frames

          check_page_frames(os.environ["QSVG_ROOT"])
          check_surah_frames(os.environ["QSVG_ROOT"])
          PY

      - name: Page 121 keeps the 5:83 word boundary
        env:
          QSVG_ROOT: ${{ env.ARTWORK }}
          QSVG_PROFILE: production
        run: python3 conformance/test_page121_ownership.py

      # The gate proper. Exits non-zero on any flagged word and prints the word
      # key, its text, and the family that disagreed.
      - name: Every word holds the marks its text spells
        env:
          QSVG_ROOT: ${{ env.ARTWORK }}
        run: |
          rm -rf .cache/marks_pages
          python3 tools/audit_marks.py ${{ github.event.inputs.pages || '1 604' }} --jobs 4

      # Cheap next to the count audit, and it is the detector that named p540's
      # stray stroke first: a slash drawn clear above or below its word's band.
      - name: No slash mark named against its drawn position
        env:
          QSVG_ROOT: ${{ env.ARTWORK }}
        run: |
          python3 tools/audit_slashpos.py ${{ github.event.inputs.pages || '1 604' }} 4 \
            /tmp/slashpos.json | tee /tmp/slashpos.txt
          grep -q "words flagged 0 on 0 pages" /tmp/slashpos.txt

      # Cheap and page-local: only the 116 pages the DK layout DB declares a
      # header line on are built, not all 604. It is a gate rather than a
      # report because the defect it names is invisible to every other audit
      # here — the ink stays on the page, in the right place, under the wrong
      # banner, so counts, pixels and segmentation are all clean.
      - name: No header group holds the other header line's ink
        env:
          QSVG_ROOT: ${{ env.ARTWORK }}
        run: |
          python3 tools/audit_headerbands.py ${{ github.event.inputs.pages || '1 604' }} \
            --build --jobs 4 --json /tmp/headerbands.json

      - name: The emitted words ARE the release's words
        env:
          QSVG_ROOT: ${{ env.ARTWORK }}
        run: |
          python3 tools/audit_segmentation.py | tee /tmp/seg.txt
          grep -qE '^count +0'    /tmp/seg.txt
          grep -qE '^skeleton +0' /tmp/seg.txt

      - name: Keep the flag files when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marks-flags
          path: |
            .cache/marks_pages
            /tmp/slashpos.json
            /tmp/headerbands.json
