# Repository-only gates: no external artwork or private repositories needed.
#
# bench, the artwork audits and the library suite need the 487 MB quran-svg
# checkout pinned at v1.1.1 (3ff27b46), so they stay local commands (CLAUDE.md,
# "Run these before believing anything"). The checks below use only this working
# set and can run on every push. Terminology remains the one most easily broken
# by an ordinary edit: one new `verse` or `fatha` in a variable name and the
# standard is no longer adopted.
name: terminology

on:
  push:
  pull_request:

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: One concept, one canonical name
        # tools/terminology is a pinned copy of the standard: quran-ws/guidelines
        # is private, a workflow cannot clone it, and a gate that cannot run is
        # not a gate. tools/terminology/README.md says how to refresh it.
        run: python3 tools/terminology/scripts/audit_terminology.py --strict

      - name: Canonical archive verifies itself
        run: python3 conformance/test_bundle_archive.py

      - name: Public bundle text forms
        run: python3 conformance/test_bundle_text_forms.py

      - name: Every Python file still parses
        run: |
          python3 - <<'PY'
          import ast, os, sys
          bad = []
          for base in ("tools", "scratchpad", "docs"):
              for dp, dn, fn in os.walk(base):
                  dn[:] = [d for d in dn if d != "__pycache__"]
                  for f in fn:
                      if f.endswith(".py"):
                          p = os.path.join(dp, f)
                          try:
                              ast.parse(open(p, encoding="utf-8").read())
                          except SyntaxError as e:
                              bad.append("%s:%s %s" % (p, e.lineno, e.msg))
          print("\n".join(bad) or "all files parse")
          sys.exit(1 if bad else 0)
          PY

      - name: The confirmed caches are still valid JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for p in glob.glob(".cache/**/*.json", recursive=True) + glob.glob("docs/**/*.json", recursive=True):
              try:
                  json.load(open(p, encoding="utf-8"))
              except Exception as e:
                  bad.append("%s: %s" % (p, e))
          print("\n".join(bad) or "all JSON parses")
          sys.exit(1 if bad else 0)
          PY
